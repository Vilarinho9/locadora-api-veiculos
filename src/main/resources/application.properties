spring.application.name=locadora-api
server.port=8080

# Banco H2 em arquivo (persiste entre execuções, sem instalar nada). Pasta: ./data
spring.datasource.url=jdbc:h2:file:./data/locadora
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dados de demonstração na primeira execução (banco vazio)
app.seed=true

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Respostas de erro vêm do GlobalExceptionHandler
spring.mvc.problemdetails.enabled=false
